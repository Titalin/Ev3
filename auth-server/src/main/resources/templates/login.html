<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Académico — Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="login-wrap">
    <section class="login-card">
        <h1>Sistema Académico</h1>
        <p class="muted">Inicia sesión para administrar divisiones y programas educativos.</p>

        <div class="alert error" th:if="${error}">Usuario o contraseña incorrectos.</div>
        <div class="alert info" th:if="${logout}">Sesión cerrada.</div>

        <form th:action="@{/login}" method="post">
            <!-- El hidden _csrf lo inyecta automaticamente Spring Security (thymeleaf-extras-springsecurity) -->
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Iniciar sesión</button>
        </form>
    </section>
</main>
</body>
</html>
