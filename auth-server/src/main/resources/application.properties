spring.application.name=auth-server
server.port=${AUTH_PORT:9000}

# ===== Configuración del Authorization Server =====
# Issuer: debe coincidir con spring.security.oauth2.resourceserver.jwt.issuer-uri de MS-A, MS-B y rate
app.issuer=${AUTH_ISSUER:http://localhost:9000}
# Origen del frontend (CORS para /oauth2/token y redirect URIs de los clientes)
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# ===== Secretos de desarrollo (cambiar en producción con variables de entorno) =====
# Usuarios en memoria (solo admin)
app.admin.user=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Secreto del cliente confidencial postman-client
app.postman-client-secret=${POSTMAN_CLIENT_SECRET:postman-secret}

# La llave RSA se genera en cada arranque (JWKSource en AuthorizationServerConfig).
# No hay persistencia: usuarios y clientes viven en memoria.
